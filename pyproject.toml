[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway-telemetry"
version = "0.1.0"
description = "Telemetry simulator, log diagnostic pipeline and monitoring dashboard for simulated home network gateways"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Myers" }]
keywords = [
    "telemetry",
    "home-gateway",
    "fastapi",
    "log-parsing",
    "observability",
    "sqlite",
    "dashboard",
    "pytest",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
gateway-telemetry = "gateway_telemetry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
