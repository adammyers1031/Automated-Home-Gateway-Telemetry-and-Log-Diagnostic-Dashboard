name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: pytest

      - name: Seed demo data and run diagnostics
        run: |
          python -m gateway_telemetry.cli seed --devices 4 --hours 1 --interval 300 --reset
          python -m gateway_telemetry.cli diagnose --window-minutes 120

      - name: Live API smoke test
        run: |
          python -m gateway_telemetry.cli serve --port 8000 --no-seed &
          sleep 3
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS "http://127.0.0.1:8000/api/v1/metrics/overview?window_minutes=1440" \
            | python -m json.tool
          curl -fsS "http://127.0.0.1:8000/api/v1/metrics/root-causes?window_minutes=1440" \
            | python -m json.tool
          curl -fsS http://127.0.0.1:8000/ | grep -q "Gateway Telemetry"
